<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="gradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0052D4" />
            <stop offset="100%" stop-color="#4364F7" />
        </linearGradient>
        
        <linearGradient id="gradRight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4FACFE" />
            <stop offset="100%" stop-color="#00F2FE" />
        </linearGradient>
        
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <g transform="translate(45, 50)">
        <path d="M 0,100 L 0,0 L 55,55" 
              fill="none" 
              stroke="url(#gradLeft)" 
              stroke-width="24" 
              stroke-linejoin="round" 
              stroke-linecap="round"/>
        
        <path d="M 55,55 L 110,0 L 110,100" 
              fill="none" 
              stroke="url(#gradRight)" 
              stroke-width="24" 
              stroke-linejoin="round" 
              stroke-linecap="round"/>
        
        <circle cx="55" cy="55" r="13" fill="#FFFFFF" filter="url(#glow)"/>
        <circle cx="55" cy="55" r="6" fill="#00F2FE"/>
    </g>
</svg>