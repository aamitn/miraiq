<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
    <defs>
        <linearGradient id="gradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0052D4" />
            <stop offset="100%" stop-color="#4364F7" />
        </linearGradient>
        
        <linearGradient id="gradRight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4FACFE" />
            <stop offset="100%" stop-color="#00F2FE" />
        </linearGradient>

        <linearGradient id="gradTextWhite" x1="0" y1="0" x2="0" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#8E97A6" />
        </linearGradient>
        
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <g transform="translate(140, 45)" 
       fill="none" 
       stroke-width="18" 
       stroke-linejoin="round" 
       stroke-linecap="round">
       
        <path d="M 0,70 L 0,0 L 30,35" stroke="url(#gradLeft)" />
        <path d="M 30,35 L 60,0 L 60,70" stroke="url(#gradRight)" />
        <circle cx="30" cy="35" r="8" fill="#FFFFFF" stroke="none" filter="url(#glow)"/>
        <circle cx="30" cy="35" r="3" fill="#00F2FE" stroke="none"/>

        <path d="M 100,0 L 100,70" stroke="url(#gradTextWhite)" />

        <path d="M 140,70 L 140,0 L 170,0 A 18 18 0 0 1 170 35 L 140,35 M 155,35 L 180,70" stroke="url(#gradTextWhite)" />

        <path d="M 215,70 L 240,0 L 265,70" stroke="url(#gradTextWhite)" />

        <path d="M 300,0 L 300,70" stroke="url(#gradTextWhite)" />
    </g>
</svg>